services:
  aprid:
    build: .
    image: aprid:latest
    container_name: aprid
    restart: unless-stopped
    ports:
      - "6601:6601"
    env_file:
      - .env
    environment:
      - PORT=6601
      - DB_PATH=/data/aprid.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6601/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
