services:
  aprid:
    # 默认拉取 Actions 构建好的预构建镜像：docker compose pull && docker compose up -d
    image: ghcr.io/snail468/aprid:latest
    # 如需改为从源码本地构建，取消下一行注释，并改用：docker compose up -d --build
    # build: .
    container_name: aprid
    restart: unless-stopped
    ports:
      - "6601:6601"
    env_file:
      - .env
    environment:
      - PORT=6601
      - DB_PATH=/data/aprid.db
      # FlareSolverr（推荐用于 Cloudflare 机场）默认地址，指向下方 flaresolverr 侧车
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # 解挑战超时（毫秒）。魔戒等强挑战站点可调大，如 180000
      - FLARESOLVERR_TIMEOUT=120000
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6601/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：FlareSolverr —— 专治 Cloudflare 的机场自动重置「FlareSolverr 模式」用它
  # 解开 CF 拿 cf_clearance。用不到可整段删除。不对公网暴露端口，仅 aprid 内网访问。
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: aprid-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
    # ports:
    #   - "8191:8191"   # 默认不暴露；仅当你要从外部连它时再打开
